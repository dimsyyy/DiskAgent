[package]
name = "diskagent"
version = "0.1.0"
edition = "2021"
description = "DiskAgent - a basic TreeSize Free style disk usage analyzer"
license = "MIT"

[[bin]]
name = "DiskAgent"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
